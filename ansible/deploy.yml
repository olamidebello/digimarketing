---
- name: Deploy DigiMarketing to Olamidepanel
  hosts: all
  become: true
  vars:
    digi_domain: digimarketing.olamidepanel.com
    digi_root: /opt/digimarketing
    digi_port: 18840
    digi_repo: https://github.com/olamidebello/digimarketing.git
    digi_ref: main
    digi_ai_env: ''
    digi_tls_email: dobcalldemo@gmail.com
    digi_apk_source: '{{ digi_root }}/repo/downloads/DigiMarketing.apk'
  tasks:
    - name: Check saved deployment settings
      ansible.builtin.stat:
        path: /etc/digimarketing/deployment.yml
      register: saved_digi_settings
    - name: Restore deployment settings without exposing credentials
      ansible.builtin.include_vars:
        file: /etc/digimarketing/deployment.yml
      when: saved_digi_settings.stat.exists
    - name: Validate deployment settings
      ansible.builtin.assert:
        that:
          - digi_domain is match('^[a-zA-Z0-9.-]+$')
          - digi_port | int > 1024
          - digi_port | int < 65536
          - digi_ai_env == '' or digi_ai_env is match('^/[a-zA-Z0-9/_.-]+$')
    - name: Check selected existing server AI environment
      ansible.builtin.stat:
        path: '{{ digi_ai_env }}'
      register: ai_file
      when: digi_ai_env != ''
    - name: Require selected existing environment file
      ansible.builtin.assert:
        that: ai_file.stat.isreg | default(false)
        fail_msg: The selected AI environment file does not exist. Set digi_ai_env to a real existing file, or use -e '{"digi_ai_env":""}' to deploy with AI drafting disabled.
      when: digi_ai_env != ''
    - name: Install runtime and gateway
      ansible.builtin.apt:
        name: [python3, git, nginx, certbot, python3-certbot-nginx, ansible-core]
        state: present
        update_cache: true
    - name: Create dedicated service account
      ansible.builtin.user:
        name: digimarketing
        system: true
        shell: /usr/sbin/nologin
        create_home: false
    - name: Prepare deployment directory
      ansible.builtin.file:
        path: '{{ digi_root }}'
        state: directory
        mode: '0755'
    - name: Pull source without discarding local changes
      ansible.builtin.git:
        repo: '{{ digi_repo }}'
        dest: '{{ digi_root }}/repo'
        version: '{{ digi_ref }}'
        force: false
    - name: Validate application syntax
      ansible.builtin.command: python3 -m py_compile {{ digi_root }}/repo/app.py
      changed_when: false
    - name: Test application before installing
      ansible.builtin.command: python3 -m unittest discover -s tests -v
      args:
        chdir: '{{ digi_root }}/repo'
      changed_when: false
    - name: Inspect existing services
      ansible.builtin.service_facts:
    - name: Stop only DigiMarketing before checking its port
      ansible.builtin.systemd:
        name: digimarketing
        state: stopped
      when: "'digimarketing.service' in ansible_facts.services"
    - name: Select free DigiMarketing port without touching other apps
      ansible.builtin.command:
        argv: [python3, '{{ digi_root }}/repo/scripts/select_port.py', '{{ digi_port | string }}']
      register: selected_digi_port
      changed_when: false
    - name: Record effective listener port
      ansible.builtin.set_fact:
        digi_listen_port: '{{ selected_digi_port.stdout | int }}'
    - name: Create protected state directory
      ansible.builtin.file:
        path: /var/lib/digimarketing
        state: directory
        owner: digimarketing
        group: digimarketing
        mode: '0700'
    - name: Create protected configuration directory
      ansible.builtin.file:
        path: /etc/digimarketing
        state: directory
        owner: root
        group: digimarketing
        mode: '0750'
    - name: Save deployment choices for future pulls
      ansible.builtin.copy:
        dest: /etc/digimarketing/deployment.yml
        owner: root
        group: root
        mode: '0600'
        content: "{{ {'digi_domain': digi_domain, 'digi_root': digi_root, 'digi_port': digi_listen_port, 'digi_repo': digi_repo, 'digi_ref': digi_ref, 'digi_ai_env': digi_ai_env, 'digi_tls_email': digi_tls_email} | to_nice_yaml }}"
    - name: Preserve account configuration on upgrades
      ansible.builtin.copy:
        dest: /etc/digimarketing/accounts.json
        content: '{}'
        force: false
        owner: root
        group: digimarketing
        mode: '0640'
    - name: Install service
      ansible.builtin.copy:
        dest: /etc/systemd/system/digimarketing.service
        mode: '0644'
        content: |
          [Unit]
          Description=DigiMarketing campaign workspace
          After=network-online.target
          Wants=network-online.target
          [Service]
          User=digimarketing
          Group=digimarketing
          WorkingDirectory={{ digi_root }}/repo
          {% if digi_ai_env != '' %}
          EnvironmentFile={{ digi_ai_env }}
          {% endif %}
          Environment=DIGI_DB=/var/lib/digimarketing/app.db
          Environment=DIGI_WORKER=0
          Environment=PORT={{ digi_listen_port }}
          Environment=DIGI_ACCOUNTS_FILE=/etc/digimarketing/accounts.json
          ExecStart=/usr/bin/python3 {{ digi_root }}/repo/app.py
          Restart=on-failure
          RestartSec=5
          UMask=0077
          NoNewPrivileges=true
          ProtectSystem=strict
          ProtectHome=true
          PrivateTmp=true
          ReadWritePaths=/var/lib/digimarketing
          [Install]
          WantedBy=multi-user.target
    - name: Back up existing database online
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "import sqlite3,pathlib,datetime; p=pathlib.Path('/var/lib/digimarketing/app.db'); p.exists() and sqlite3.connect(str(p)).backup(sqlite3.connect(str(p)+'.'+datetime.datetime.now().strftime('%Y%m%d%H%M%S')+'.bak'))"
      changed_when: false
    - name: Start application
      ansible.builtin.systemd:
        name: digimarketing
        enabled: true
        state: restarted
        daemon_reload: true
    - name: Verify application readiness
      ansible.builtin.uri:
        url: http://127.0.0.1:{{ digi_listen_port }}/health
      register: ready
      retries: 10
      delay: 2
      until: ready.status == 200 and ready.json.service | default('') == 'digimarketing'
    - name: Read service process identity
      ansible.builtin.command: systemctl show digimarketing.service --property=MainPID --value
      register: digi_main_pid
      changed_when: false
    - name: Require response from the actual DigiMarketing process
      ansible.builtin.assert:
        that:
          - ready.json.pid | int == digi_main_pid.stdout | int
          - digi_main_pid.stdout | int > 0
    - name: Inspect existing domain configuration
      ansible.builtin.command:
        argv: [python3, '{{ digi_root }}/repo/scripts/check_nginx_domain.py', '{{ digi_domain }}']
      changed_when: false
    - name: Check existing domain certificate
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/{{ digi_domain }}/fullchain.pem
      register: digi_existing_cert
    - name: Repair dedicated domain gateway and preserve a backup
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/{{ digi_domain }}
        backup: true
        mode: '0644'
        content: |
          # Managed by DigiMarketing. Other domain configurations are preserved.
          server {
            listen 80;
            server_name {{ digi_domain }};
          {% if digi_existing_cert.stat.exists %}
            return 301 https://$host$request_uri;
          }
          server {
            listen 443 ssl;
            server_name {{ digi_domain }};
            ssl_certificate /etc/letsencrypt/live/{{ digi_domain }}/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/{{ digi_domain }}/privkey.pem;
          {% endif %}
            client_max_body_size 64k;
            location / {
              proxy_pass http://127.0.0.1:{{ digi_listen_port }};
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 60s;
              add_header Cache-Control "no-store" always;
            }
          }
    - name: Enable domain
      ansible.builtin.file:
        src: /etc/nginx/sites-available/{{ digi_domain }}
        dest: /etc/nginx/sites-enabled/{{ digi_domain }}
        state: link
    - name: Validate all gateway configuration
      ansible.builtin.command: nginx -t
      changed_when: false
    - name: Reload gateway
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
    - name: Obtain domain HTTPS certificate
      ansible.builtin.command:
        argv: [certbot, --nginx, -d, '{{ digi_domain }}', --non-interactive, --agree-tos, --redirect, -m, '{{ digi_tls_email }}', --keep-until-expiring]
      register: certificate
      changed_when: "'no action taken' not in certificate.stdout"
    - name: Publish supplied built APK
      ansible.builtin.include_tasks: publish-app.yml
      when: digi_apk_source != ''
    - name: Verify public HTTPS endpoint
      ansible.builtin.uri:
        url: https://{{ digi_domain }}/health
        validate_certs: true
      register: public_digi_health
      failed_when: public_digi_health.status != 200 or public_digi_health.json.service | default('') != 'digimarketing'
    - name: Verify public homepage branding
      ansible.builtin.uri:
        url: https://{{ digi_domain }}/
        return_content: true
        validate_certs: true
      register: public_digi_home
      failed_when: public_digi_home.status != 200 or 'DigiMarketing' not in public_digi_home.content or 'Africa Credit' in public_digi_home.content
    - name: Install scheduled Ansible batch service
      ansible.builtin.copy:
        dest: /etc/systemd/system/digimarketing-batch.service
        mode: '0644'
        content: |
          [Unit]
          Description=DigiMarketing approved campaign batch via Ansible
          After=digimarketing.service network-online.target
          [Service]
          Type=oneshot
          User=digimarketing
          Group=digimarketing
          WorkingDirectory={{ digi_root }}/repo
          Environment=HOME=/var/lib/digimarketing
          Environment=ANSIBLE_LOCAL_TEMP=/var/lib/digimarketing/ansible-tmp
          Environment=PYTHONDONTWRITEBYTECODE=1
          ExecStart=/usr/bin/ansible-playbook -i localhost, -c local {{ digi_root }}/repo/ansible/run-campaign-batch.yml -e digi_root={{ digi_root }}
          TimeoutStartSec=5min
          UMask=0077
          NoNewPrivileges=true
          ProtectSystem=strict
          ProtectHome=true
          PrivateTmp=true
          ReadWritePaths=/var/lib/digimarketing
    - name: Install campaign batch timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/digimarketing-batch.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Run DigiMarketing campaign batch each minute
          [Timer]
          OnBootSec=60s
          OnUnitInactiveSec=60s
          Unit=digimarketing-batch.service
          [Install]
          WantedBy=timers.target
    - name: Enable campaign automation timer
      ansible.builtin.systemd:
        name: digimarketing-batch.timer
        enabled: true
        state: started
        daemon_reload: true
    - name: Report deployment
      ansible.builtin.debug:
        msg: "DigiMarketing app identity, homepage and HTTPS verified on port {{ digi_listen_port }}. AI environment selected={{ digi_ai_env != '' }}. Configure OPENAI_MODEL in the existing environment if absent. APK installed={{ digi_apk_source != '' }}. Other social integrations remain manual export."
