---
- name: Provision DigiMarketing Facebook Page connection
  hosts: all
  become: true
  gather_facts: false
  vars:
    digi_root: /opt/digimarketing
    digi_facebook_owner: dobcalldemo@gmail.com
    digi_facebook_page_id: '1448088625044064'
    digi_facebook_version: v26.0
    digi_facebook_enable: false
    # Empty reuses the encrypted token already saved by the super admin GUI.
    digi_facebook_token_file: ''
  tasks:
    - name: Provision and verify saved Facebook connection without exposing credentials
      ansible.builtin.command:
        argv: "{{ ['python3', playbook_dir + '/../scripts/provision-facebook.py', '--owner', digi_facebook_owner, '--page', digi_facebook_page_id | string, '--version', digi_facebook_version] + (['--token-file', digi_facebook_token_file] if digi_facebook_token_file | length > 0 else []) + (['--enable'] if digi_facebook_enable | bool else []) }}"
      environment:
        DIGI_DB: /var/lib/digimarketing/app.db
        DIGI_MASTER_KEY_FILE: /etc/digimarketing/master.key
      register: facebook_provision
      no_log: true
      failed_when: false
      changed_when: facebook_provision.rc == 0 and (facebook_provision.stdout | from_json).changed | bool
    - name: Report safe provisioning failure
      ansible.builtin.fail:
        msg: "Facebook provisioning failed: {{ (facebook_provision.stdout | default('{}', true) | from_json).error_code | default('LOCAL_CONFIGURATION_ERROR') }}. No changes committed. TOKEN_DECRYPT_FAILED means the saved token and encryption key do not match; META_TOKEN_INVALID_OR_EXPIRED requires a replacement Page token; PAGE_ID_MISMATCH requires the token's correct Graph Page ID; TOKEN_MISSING requires saving a token first. Credentials remain hidden."
      when: not ansible_check_mode and facebook_provision.rc | default(1) != 0
    - name: Report provisioning result without credentials
      when: not ansible_check_mode
      ansible.builtin.debug:
        msg: 'Facebook Page {{ digi_facebook_page_id }} identity verified; publishing enabled={{ digi_facebook_enable | bool }}. Manage the connection in API & keys. No post was sent. Identity verification does not prove posting permission.'
